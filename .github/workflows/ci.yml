name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn
      - run: corepack prepare yarn@4.18.0 --activate
      - run: yarn install --immutable
      - run: yarn dedupe --check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn npm audit -A -R --severity low
      - run: yarn build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn
      - run: corepack prepare yarn@4.18.0 --activate
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
